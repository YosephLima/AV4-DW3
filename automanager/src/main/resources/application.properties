# Banco em memória: a aplicação roda sem instalar nada e o seed recria os dados a cada inicialização.
# Para outro banco, basta definir SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD
# no ambiente (e incluir o driver no pom.xml)
spring.datasource.url=jdbc:h2:mem:automanager
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
# O console do H2 não passa pela autenticação JWT e exporia o banco inteiro, por isso fica desligado
spring.h2.console.enabled=false

# Para usar o MySQL da base original, comente o bloco acima e descomente este
#spring.datasource.url=jdbc:mysql://localhost:3306/base?createDatabaseIfNotExist=true
#spring.datasource.username=root
#spring.datasource.password=root
#spring.jpa.hibernate.ddl-auto=create

# Inclui a mensagem da ResponseStatusException no corpo de erro padrão do Spring Boot
server.error.include-message=always
# O devtools liga o stack trace e a lista crua de erros de validação nas respostas de erro
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# JWT. O segredo assina os tokens com HS512, que exige ao menos 64 bytes. O valor abaixo serve
# só para desenvolvimento: em qualquer outro ambiente, defina a variável JWT_SECRET
jwt.secret=${JWT_SECRET:automanager-segredo-de-desenvolvimento-troque-em-producao-hs512-64-bytes}
# Validade do token em milissegundos (3600000 = 1 hora)
jwt.expiration=${JWT_EXPIRATION:3600000}
